# Inherit the official Raspberry Pi 3 64-bit configuration
require conf/machine/raspberrypi3-64.conf

# Use the Raspberry Pi 3 64-bit kernel defconfig
KBUILD_DEFCONFIG:techleef-rpi3w64 = "bcmrpi3_defconfig"

# Bootloader
RPI_USE_U_BOOT = "1"

# Hardware interfaces
ENABLE_UART = "1"
ENABLE_I2C = "1"

RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/techleef-hcsr04.dtbo"
RPI_EXTRA_CONFIG += "dtoverlay=techleef-hcsr04"
WKS_FILE = "techleef-rpi3w64.wks"

# Install RAUC for A/B OTA updates
IMAGE_INSTALL:append = " rauc rauc-mark-good techleef-rauc-conf"
PREFERRED_RPROVIDER_virtual-rauc-conf = "techleef-rauc-conf"
